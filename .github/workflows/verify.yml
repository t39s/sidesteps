name: Validate sidesteps candidate
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and domain model
        run: |
          node --check model.js
          node --check app.js
          node --check sw.js
          node --test tests/*.test.cjs
      - name: Validate candidate config and manifest
        run: |
          python3 -m json.tool config.json > /dev/null
          python3 -m json.tool manifest.webmanifest > /dev/null
          sha256sum -c MANIFEST_SHA256.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Browser, mobile, profile migration and PWA regression
        env:
          CHROMIUM_EXECUTABLE: ''
        run: |
          python tests/browser_smoke.py
          python tests/mobile_regression.py
          python tests/profiles_browser.py
      - name: Package verified candidate
        run: |
          git archive --format=zip --output=sidesteps_candidate.zip HEAD
          sha256sum sidesteps_candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sidesteps-candidate-${{ github.sha }}
          path: sidesteps_candidate.zip
