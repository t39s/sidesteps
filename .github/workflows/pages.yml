name: Test and publish sidesteps to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Validate sidesteps candidate"]
    types: [completed]
    branches: [develop]
permissions:
  contents: read
  actions: read
concurrency:
  group: sidesteps-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.package.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-src
      - name: Checkout candidate for a stable or manual publication
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: develop
          path: preview-src
      - name: Download verified candidate
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: sidesteps-candidate-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: verified
      - name: Check artifact identity and extract candidate
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git ls-remote https://github.com/${{ github.repository }}.git refs/heads/develop | cut -f1)
          test "$current" = "$EXPECTED_SHA"
          test "$(cat verified/candidate.commit)" = "$EXPECTED_SHA"
          (cd verified && sha256sum -c candidate.sha256)
          mkdir preview-src
          unzip -q verified/sidesteps_candidate.zip -d preview-src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate stable and candidate
        if: github.event_name != 'workflow_run'
        run: |
          for dir in stable-src preview-src; do
            node --check "$dir/model.js"
            node --check "$dir/app.js"
            node --check "$dir/sw.js"
            node --test "$dir"/tests/*.test.cjs
            python3 -m json.tool "$dir/config.json" > /dev/null
            python3 -m json.tool "$dir/manifest.webmanifest" > /dev/null
            (cd "$dir" && sha256sum -c MANIFEST_SHA256.txt)
          done
      - name: Check packaged source integrity
        run: |
          (cd stable-src && sha256sum -c MANIFEST_SHA256.txt)
          (cd preview-src && sha256sum -c MANIFEST_SHA256.txt)
      - name: Build Pages directory
        run: |
          mkdir -p public/preview
          for name in index.html app.js model.js styles.css config.json sw.js manifest.webmanifest icon.svg; do
            cp "stable-src/$name" "public/$name"
            cp "preview-src/$name" "public/preview/$name"
          done
          if [ -f stable-src/migration.js ]; then
            node --check stable-src/migration.js
            cp stable-src/migration.js public/migration.js
          fi
          if [ -f preview-src/migration.js ]; then
            node --check preview-src/migration.js
            cp preview-src/migration.js public/preview/migration.js
          fi
          touch public/.nojekyll
      - name: Name the Pages artifact
        id: package
        run: echo "name=github-pages-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.package.outputs.name }}
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Wait for the exact Pages artifact
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            const id = process.env.PAGES_ARTIFACT_ID;
            if (!name || !/^\d+$/.test(id || '')) {
              throw new Error('The build did not provide a Pages artifact name and ID.');
            }

            const deadline = Date.now() + 60_000;
            while (Date.now() < deadline) {
              let artifacts = [];
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  ...context.repo, run_id: context.runId, name, per_page: 2,
                  request: { timeout: 5000 },
                });
                artifacts = data.artifacts;
              } catch (error) {
                if (error.status !== 429 && !(error.status >= 500)) throw error;
                core.warning(`Artifact lookup returned HTTP ${error.status}; retrying.`);
              }

              if (artifacts.length > 1) {
                throw new Error(`Multiple Pages artifacts named ${name} are visible in run ${context.runId}.`);
              }
              const artifact = artifacts[0];
              if (artifact) {
                if (String(artifact.id) !== id || artifact.expired) {
                  throw new Error(`Pages artifact ${name} does not match active artifact ID ${id}.`);
                }
                core.info(`Pages artifact ${name} (ID ${id}) is visible.`);
                return;
              }
              const delay = Math.min(5000, deadline - Date.now());
              if (delay > 0) await new Promise(resolve => setTimeout(resolve, delay));
            }
            throw new Error(`Timed out waiting for Pages artifact ${name} (ID ${id}) in run ${context.runId}.`);
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
  tag_release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout published stable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Create immutable release tag if absent
        run: |
          grep -qx 'sidesteps v0.3.4' <(head -n 1 RELEASE_INFO.txt)
          if git ls-remote --exit-code origin refs/tags/v0.3.4; then
            echo 'v0.3.4 already exists; no change to tag.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.3.4 -m 'sidesteps v0.3.4 — accepted stable release'
          git push origin refs/tags/v0.3.4
